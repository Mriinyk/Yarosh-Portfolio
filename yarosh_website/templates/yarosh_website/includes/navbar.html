{% load static %}
<header class="site-header">
    <nav class="navbar navbar-expand-md site-navbar" aria-label="Основна навігація">
        <div class="site-navbar-top">
            <a class="navbar-brand site-brand" href="{% url 'index' %}" aria-label="Yarosh Portfolio — головна">
                <img src="{% static 'yarosh_website/images/logo.png' %}" alt="Логотип Yarosh Portfolio" class="site-logo">
            </a>

            <button class="nav-link site-nav-link site-theme-toggle site-theme-toggle-mobile" id="siteThemeToggleMobile" type="button"
                    aria-label="Увімкнути темну тему" aria-pressed="false">
                <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                </svg>
                <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
                </svg>
            </button>

            <button class="navbar-toggler site-navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#siteNavbar" aria-controls="siteNavbar" aria-expanded="false"
                    aria-label="Відкрити навігацію">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse" id="siteNavbar">
            <ul class="navbar-nav site-account-nav align-items-md-center">
                {% if request.user.is_authenticated %}
                    <li class="nav-item site-account-control">
                        <span class="site-user-name">{{ request.user.username }}</span>
                        <form class="site-logout-form" method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="nav-link site-nav-link site-logout-link" type="submit"
                                    aria-label="Вийти з акаунта" title="Вийти з акаунта">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                                </svg>
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link site-nav-link{% if request.resolver_match.url_name == 'login' or request.resolver_match.url_name == 'signup' %} is-active{% endif %}"
                           href="{% url 'login' %}?next={{ request.path|urlencode }}"{% if request.resolver_match.url_name == 'login' or request.resolver_match.url_name == 'signup' %} aria-current="page"{% endif %}>
                            Увійти
                        </a>
                    </li>
                {% endif %}
            </ul>
            <ul class="navbar-nav site-links-nav ms-auto align-items-md-center">
                <li class="nav-item">
                    <a class="nav-link site-nav-link{% if request.resolver_match.url_name == 'index' %} is-active{% endif %}"
                       href="{% url 'index' %}"{% if request.resolver_match.url_name == 'index' %} aria-current="page"{% endif %}>Головна</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link site-nav-link{% if request.resolver_match.url_name == 'photos' %} is-active{% endif %}"
                       href="{% url 'photos' %}"{% if request.resolver_match.url_name == 'photos' %} aria-current="page"{% endif %}>Фотосесії</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link site-nav-link{% if request.resolver_match.url_name == 'contact' %} is-active{% endif %}"
                       href="{% url 'contact' %}"{% if request.resolver_match.url_name == 'contact' %} aria-current="page"{% endif %}>Зв'язатися</a>
                </li>
                <li class="nav-item">
                    <button class="nav-link site-nav-link site-theme-toggle site-theme-toggle-desktop" id="siteThemeToggle" type="button"
                            aria-label="Увімкнути темну тему" aria-pressed="false">
                        <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                        </svg>
                        <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>
</header>
