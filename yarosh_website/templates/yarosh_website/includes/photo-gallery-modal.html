<div class="photo-gallery-modal" data-photo-gallery-modal hidden
     role="dialog" aria-modal="true" aria-label="Галерея фотосесії" tabindex="-1">
    <button class="photo-gallery-close" type="button" data-gallery-close aria-label="Закрити галерею">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 7 10 10M17 7 7 17"></path>
        </svg>
    </button>
    <p class="photo-gallery-counter" data-gallery-counter aria-live="polite"></p>
    <p class="photo-gallery-status" data-gallery-status role="status"></p>
    <div class="photo-gallery-viewer">
        <button class="photo-gallery-nav photo-gallery-previous" type="button"
                data-gallery-previous aria-label="Попереднє фото">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m14.5 5-7 7 7 7"></path>
            </svg>
        </button>
        <img data-gallery-image alt="Фото з фотосесії" hidden>
        <button class="photo-gallery-nav photo-gallery-next" type="button"
                data-gallery-next aria-label="Наступне фото">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9.5 5 7 7-7 7"></path>
            </svg>
        </button>
    </div>
</div>
